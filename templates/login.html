<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · GiaoGọn</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-body"><main class="login-panel"><a class="brand" href="/">↗ <b>GiaoGọn</b><span>Điều phối và giao hàng thông minh</span></a>
<nav class="auth-tabs" aria-label="Tài khoản"><button type="button" id="tab-login" class="nav active">Đăng nhập</button><button type="button" id="tab-register" class="nav">Đăng ký</button></nav>
<h1 id="login-title">Chào mừng trở lại.</h1><p id="login-description">Đăng nhập để xem đơn hàng và chuyến giao của bạn.</p>
<form id="login-form"><label class="field">Tên đăng nhập<input id="username" required minlength="3" maxlength="60" pattern="[a-z0-9_.-]{3,60}" title="3–60 ký tự a-z, số, dấu chấm, gạch ngang hoặc gạch dưới" autocomplete="username"></label><label class="field">Mật khẩu<input id="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label><label class="field" id="confirm-label" hidden>Nhập lại mật khẩu<input id="password-confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" disabled></label><button id="login-submit" class="primary big">Đăng nhập</button><p id="login-error" role="alert"></p></form>
<p id="switch-hint" class="hint">Chưa có tài khoản? <button type="button" class="text-btn" id="switch-mode">Đăng ký ngay</button></p><p id="role-hint" class="hint">Admin điều phối · Nhân viên giao hàng · Khách hàng tạo và theo dõi đơn</p><small id="db-label"></small></main><script src="/static/auth.js"></script></body></html>
